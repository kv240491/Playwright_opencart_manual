# To run manually:
# Go to your repository → Actions → Playwright Tests → Run workflow
# Choose the test suite, browser, and mode → Run workflow

name: Playwright Tests

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select test suite"
        required: true
        type: choice
        options:
          - master
          - api
          - web
          - db
          - datadriven
        default: "master"

      browser:
        description: "Select browser"
        required: true
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: "chromium"

      mode:
        description: "Select run mode"
        required: true
        type: choice
        options:
          - headless
          - headed
        default: "headless"

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      # Step 3: Install project dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Step 5: Create .env file
      - name: Create .env File
        shell: powershell
        run: Copy-Item .env.example .env

      # Step 6: Run Playwright tests
      - name: Run Playwright Tests
        shell: powershell
        run: |
          $suite = "${{ inputs.test_suite || 'master' }}"
          $browser = "${{ inputs.browser || 'chromium' }}"
          $mode = "${{ inputs.mode || 'headless' }}"

          # Convert selected suite to the actual Playwright tag
          if ($suite -eq "datadriven") {
              $tag = "@Datadriven"
          } else {
              $tag = "@$suite"
          }

          $browserFlag = "--project=$browser"

          if ($mode -eq "headed") {
              $modeFlag = "--headed"
          } else {
              $modeFlag = ""
          }

          Write-Host "Running Test Suite: $suite"
          Write-Host "Playwright Tag: $tag"
          Write-Host "Browser: $browser"
          Write-Host "Mode: $mode"

          npx playwright test --grep $tag $browserFlag $modeFlag --output=test-results
        env:
          CI: "1"

      # Step 7: Upload Playwright report
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          retention-days: 30

      # Step 8: Upload custom report
      - name: Upload Custom Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-report
          path: custom-report/
          retention-days: 30

      # Step 9: Upload Allure results
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30